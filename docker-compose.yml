services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '15432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '16380:6379'

  qdrant:
    image: qdrant/qdrant:v1.7.3
    ports:
      - '16334:6333'
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/copilot
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: supersecret
      WHATSAPP_VERIFY_TOKEN: wh_verify_token
      WHATSAPP_ACCESS_TOKEN: wh_access_token
      PYTHONPATH: /app
    env_file:
      - .env
    ports:
      - '18000:8000'
    depends_on:
      - db
      - redis
      - qdrant

  celery-worker:
    build:
      context: ./backend
    command: celery -A app.core.celery_app.celery_app worker -l info --pool=solo
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/copilot
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: supersecret
      PYTHONPATH: /app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - qdrant

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:18000
    env_file:
      - .env
    ports:
      - '13000:3000'
    depends_on:
      - backend

volumes:
  db-data:
  qdrant-data: